name: Sift
options:
  bundleIdPrefix: com.droessmj
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Team.xcconfig
  Release: Config/Team.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    ITSAppUsesNonExemptEncryption: NO
packages:
  HabitKit:
    path: packages/HabitKit
  ExpectedCallsCore:
    path: apps/ExpectedCalls/Core
targets:
  Sift:
    type: application
    platform: iOS
    sources: [apps/Sift/App, apps/Sift/Shared]
    info:
      path: apps/Sift/App/Info.plist
      properties:
        CFBundleDisplayName: Blotter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        SiftKeychainAccessGroup: $(AppIdentifierPrefix)com.droessmj.sift.shared
        NSPrivacyAccessedAPITypeDescriptorBundleIdentifier: com.droessmj.sift
    privacyManifest:
      path: apps/Sift/Shared/PrivacyInfo.xcprivacy
    entitlements:
      path: apps/Sift/App/Sift.entitlements
      properties:
        com.apple.security.application-groups: [group.com.droessmj.sift]
        # Retained only so the app can delete activity saved by older builds.
        keychain-access-groups: [$(AppIdentifierPrefix)com.droessmj.sift.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.droessmj.sift
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SiftFilter
  SiftFilter:
    type: app-extension
    platform: iOS
    sources:
      - apps/Sift/Filter
      - path: apps/Sift/Shared
        excludes: [LegacyActivityCleanup.swift]
    info:
      path: apps/Sift/Filter/Info.plist
      properties:
        CFBundleDisplayName: Blotter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.identitylookup.message-filter
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessageFilterExtension
        # Filter extensions are signed with a team-prefixed bundle ID, so no resolvable key exists
        # for the privacy manifest; the manifest itself still ships.
        NSPrivacyAccessedAPITypeDescriptorBundleIdentifier: []
    privacyManifest:
      path: apps/Sift/Shared/PrivacyInfo.xcprivacy
    entitlements:
      path: apps/Sift/Filter/SiftFilter.entitlements
      properties:
        com.apple.security.application-groups: [group.com.droessmj.sift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.droessmj.sift.filter
        TARGETED_DEVICE_FAMILY: "1"

  Daymark:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [apps/Daymark/App, apps/Daymark/Assets.xcassets, apps/Daymark/PrivacyInfo.xcprivacy]
    info:
      path: apps/Daymark/Info.plist
      properties:
        CFBundleDisplayName: Day in Ink
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.droessmj.daymark
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: HabitKit
  DaymarkUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [apps/Daymark/UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.droessmj.daymark.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Daymark
  ExpectedCalls:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [apps/ExpectedCalls/App]
    info:
      path: apps/ExpectedCalls/Info.plist
      properties:
        CFBundleDisplayName: Expected Calls
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.droessmj.expectedcalls
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: ExpectedCallsCore
  ExpectedCallsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [apps/ExpectedCalls/UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.droessmj.expectedcalls.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ExpectedCalls
schemes:
  Sift:
    build:
      targets:
        Sift: all
  Daymark:
    build:
      targets:
        Daymark: all
    test:
      targets:
        - DaymarkUITests
  ExpectedCalls:
    build:
      targets:
        ExpectedCalls: all
    test:
      targets:
        - ExpectedCallsUITests
