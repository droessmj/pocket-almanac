name: Blotter
options:
  bundleIdPrefix: com.droessmj
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Team.xcconfig
  Release: Config/Team.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "6"
    ITSAppUsesNonExemptEncryption: NO
packages:
  HabitKit:
    path: packages/HabitKit
targets:
  Blotter:
    type: application
    platform: iOS
    sources: [apps/Blotter/App, apps/Blotter/Shared]
    info:
      path: apps/Blotter/App/Info.plist
      properties:
        CFBundleDisplayName: Blotter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    privacyManifest:
      path: apps/Blotter/Shared/PrivacyInfo.xcprivacy
    entitlements:
      path: apps/Blotter/App/Blotter.entitlements
      properties:
        com.apple.security.application-groups: [group.com.droessmj.blotter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.droessmj.blotter
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BlotterFilter
  BlotterFilter:
    type: app-extension
    platform: iOS
    sources:
      - apps/Blotter/Filter
      - apps/Blotter/Shared
    info:
      path: apps/Blotter/Filter/Info.plist
      properties:
        CFBundleDisplayName: Blotter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.identitylookup.message-filter
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessageFilterExtension
    privacyManifest:
      path: apps/Blotter/Shared/PrivacyInfo.xcprivacy
    entitlements:
      path: apps/Blotter/Filter/BlotterFilter.entitlements
      properties:
        com.apple.security.application-groups: [group.com.droessmj.blotter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.droessmj.blotter.filter
        TARGETED_DEVICE_FAMILY: "1"

  DayInInk:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [apps/DayInInk/App, apps/DayInInk/Assets.xcassets, apps/DayInInk/PrivacyInfo.xcprivacy]
    info:
      path: apps/DayInInk/Info.plist
      properties:
        CFBundleDisplayName: Day in Ink
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.droessmj.dayinink
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: HabitKit
  DayInInkUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [apps/DayInInk/UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.droessmj.dayinink.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DayInInk
schemes:
  Blotter:
    build:
      targets:
        Blotter: all
  DayInInk:
    build:
      targets:
        DayInInk: all
    test:
      targets:
        - DayInInkUITests
